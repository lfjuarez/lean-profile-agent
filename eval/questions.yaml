- {cat: services, lang: es, q: "¿Dictás cursos de Splunk Enterprise Security oficiales?", expect: answer, must: ["Power User|Fast Start"], never: ["sí dicta el curso oficial de Enterprise Security"]}
- {cat: services, lang: en, q: "Can you migrate our SIEM from QRadar to Splunk?", expect: answer, must: ["migrat"]}
