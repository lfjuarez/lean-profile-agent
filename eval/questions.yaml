# expect: answer -> must cite and mention every `must` term (any of the alternatives split by |)
#         decline -> must say it is not documented and cite nothing
# `never`: terms that must not appear in the answer
- {cat: personal, lang: es, q: "¿Dónde vivís?", expect: answer, must: ["Buenos Aires"]}
- {cat: personal, lang: es, q: "¿De qué país sos?", expect: answer, must: ["Argentina"]}
- {cat: personal, lang: en, q: "Where are you based?", expect: answer, must: ["Buenos Aires|Argentina"]}
- {cat: personal, lang: es, q: "¿Cuántos años tenés?", expect: decline}
- {cat: personal, lang: en, q: "How old are you?", expect: decline}
- {cat: personal, lang: es, q: "¿Estás casado? ¿Tenés hijos?", expect: decline}
- {cat: personal, lang: es, q: "¿Qué idiomas hablás?", expect: answer, must: ["español|Español", "inglés|Inglés"]}
- {cat: personal, lang: en, q: "What is your English level?", expect: answer, must: ["professional|advanced|Advanced"]}
- {cat: personal, lang: es, q: "¿Qué estudiaste?", expect: answer, must: ["Ciencia de Datos"]}
- {cat: personal, lang: en, q: "Do you have a master's degree?", expect: answer, must: ["Data Science"]}
- {cat: personal, lang: es, q: "¿Cuál es tu hobby?", expect: decline}
- {cat: experience, lang: es, q: "¿Cuántos años de experiencia tenés?", expect: answer, must: ["12"]}
- {cat: experience, lang: en, q: "How many years have you worked with Splunk?", expect: answer, must: ["5|6|2020"]}
- {cat: experience, lang: es, q: "¿Dónde trabajás actualmente?", expect: answer, must: ["Mercado Libre"]}
- {cat: experience, lang: en, q: "What did you do at Target Minds?", expect: answer, must: ["Splunk"]}
- {cat: experience, lang: es, q: "¿Trabajaste con Elastic?", expect: answer, must: ["Elastic"]}
- {cat: experience, lang: en, q: "Have you worked with AWS or Terraform?", expect: answer, must: ["Terraform"]}
- {cat: experience, lang: es, q: "¿Qué hiciste con inteligencia artificial?", expect: answer, must: ["2.000|2,000"]}
- {cat: experience, lang: en, q: "Tell me about a project you are proud of", expect: answer, must: ["2,000|2.000"]}
- {cat: experience, lang: es, q: "¿Trabajaste en el sector bancario?", expect: answer, must: ["banca|bancos|banco"]}
- {cat: experience, lang: en, q: "Do you have experience with compliance audits like PCI DSS?", expect: answer, must: ["PCI"]}
- {cat: experience, lang: es, q: "¿Sabés programar en Python?", expect: answer, must: ["Python"]}
