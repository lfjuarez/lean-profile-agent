- {cat: experience, lang: es, q: "¿Trabajaste con QRadar o Sentinel?", expect: decline}
- {cat: experience, lang: en, q: "What is PresupuestAR?", expect: answer, must: ["SaaS"]}
- {cat: leadership, lang: es, q: "¿Tenés experiencia liderando equipos?", expect: answer, must: ["Target Minds|líder|liderazgo|Leader|lideró"]}
- {cat: leadership, lang: en, q: "How big was the team you led?", expect: answer, must: ["2 to 4|2-4|two to four"]}
- {cat: leadership, lang: en, q: "Describe your leadership style", expect: answer}
- {cat: leadership, lang: es, q: "¿Cómo transferís conocimiento a un equipo?", expect: answer, must: ["material propio|capacitación|transferencia"]}
- {cat: leadership, lang: en, q: "Tell me about a time you handled a conflict in your team", expect: decline}
- {cat: leadership, lang: es, q: "¿Cómo priorizás un backlog técnico?", expect: answer}
